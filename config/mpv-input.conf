# Omarchy TV: mpv on a remote. Arrows seek and set volume, OK pauses,
# Back/Escape stops and returns to the TV home.
LEFT        seek -10
RIGHT       seek 10
UP          add volume 5
DOWN        add volume -5
ENTER       cycle pause
KP_ENTER    cycle pause
SPACE       cycle pause
ESC         quit-watch-later
BS          quit-watch-later
Back        quit-watch-later
MENU        script-binding stats/display-stats-toggle
PGUP        add chapter 1
PGDWN       add chapter -1
PLAYPAUSE   cycle pause
NEXT        playlist-next
PREV        playlist-prev
s           cycle sub
a           cycle audio
i           script-binding stats/display-stats-toggle
